name: Security & Supply Chain Gates

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday at 04:00 UTC

permissions:
  contents: read

jobs:
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571 # v4.0.2
        with:
          node-version: 20
          cache: 'npm'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dab2a725c1001912937b960f8922b9 # v3.24.6
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@48ab28a6f5dab2a725c1001912937b960f8922b9 # v3.24.6

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@e85cb32fdb4a5595c517f8db85a6a68f6a988d84 # v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571 # v4.0.2
        with:
          node-version: 20

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: error

  license-check:
    name: license-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571 # v4.0.2
        with:
          node-version: 20

      - name: Check dependency licenses
        run: |
          npx license-checker --production --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;CC0-1.0;Python-2.0' --summary

  self-audit:
    name: self-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571 # v4.0.2
        with:
          node-version: 20
          cache: 'npm'

      - name: Run Self-Audit Script
        run: bash scripts/self-audit.sh


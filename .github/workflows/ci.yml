name: CI

on:
  push:
    branches: [development, 'feature/**']
  pull_request:
    branches: [development]

jobs:
  lint-typecheck-unit:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:unit

  build:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://proofpay:proofpay@localhost:5432/proofpay'
          PAYPAL_ENV: 'sandbox'
          PAYPAL_CLIENT_ID: 'dummy_ci_client_id'
          PAYPAL_CLIENT_SECRET: 'dummy_ci_client_secret'
          ANTHROPIC_API_KEY: 'dummy_ci_anthropic_key'
          SESSION_SECRET: 'dummy_ci_session_secret_at_least_32_characters'
          DEMO_MODE: 'true'
